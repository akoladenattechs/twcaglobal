; PHP-FPM user ini — applies to all PHP requests served from this directory.
; This file is the correct way to override PHP limits on cPanel / PHP-FPM hosts.
; (The .htaccess php_value approach only works with mod_php and is ignored by PHP-FPM.)

; Allow larger file uploads (event flyers, sermon covers, etc.)
upload_max_filesize = 10M
post_max_size = 15M

; Give PHP enough memory to process and compress large images with GD
memory_limit = 256M

; Allow more time for uploading large files to Cloudflare R2
max_execution_time = 300
max_input_time = 300
